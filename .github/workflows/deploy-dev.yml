name: Deploy dev

# Every merge to main: database migrations and Edge Functions go to airhead-dev.
# (The static app is built and deployed by Cloudflare Pages' Git integration.)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supabase:
    name: supabase dev
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_DEV }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Dev deploy skipped: SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF_DEV / SUPABASE_DB_PASSWORD_DEV secrets are not set yet (see docs/BLOCKERS.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ready == 'true'
        name: Link dev project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: steps.secrets.outputs.ready == 'true'
        name: Apply migrations
        run: npx supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - if: steps.secrets.outputs.ready == 'true'
        name: Deploy Edge Functions
        run: npx supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --use-api --yes
