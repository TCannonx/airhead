name: CI

# Pull requests only: a squash merge lands exactly the tested, up-to-date
# branch, so re-running everything on main only doubled the minutes used.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint, typecheck and the function tests share one runner: each job is billed
  # in whole minutes, so three one-minute jobs cost three minutes.
  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      # The repo root's package.json belongs to the app; Deno must not read it.
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Type-check every function entry point and shared module (tests only check what they import).
      - run: deno check --node-modules-dir=none supabase/functions/_shared/*.ts supabase/functions/*/index.ts
      - run: deno test --node-modules-dir=none --allow-env --allow-net=127.0.0.1 --allow-read=tests/fixtures,src/lib/today,supabase/functions/_shared/today,src/lib/leave,supabase/functions/_shared/leave supabase/functions

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  e2e-sync:
    name: e2e sync tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Auth, REST, Realtime and the local mail catcher are needed; the rest isn't.
      # Runners sometimes fail Docker's port binding ("address already in use");
      # clean up and retry instead of failing the run.
      - name: Start the local stack
        run: |
          for attempt in 1 2 3; do
            npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta && exit 0
            echo "supabase start failed (attempt $attempt); stopping and retrying"
            npx supabase stop --no-backup || true
            sleep 15
          done
          exit 1
      - name: Point the app at the local stack
        run: |
          npx supabase status -o env > /tmp/sb.env
          echo "variables available: $(cut -d= -f1 /tmp/sb.env | tr '\n' ' ')"
          set -a; . /tmp/sb.env; set +a
          key="${ANON_KEY:-$PUBLISHABLE_KEY}"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$key" >> "$GITHUB_ENV"
      - run: npx playwright test --config playwright.sync.config.ts
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-sync-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  db:
    name: database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Starts Postgres only and applies every migration in supabase/migrations.
      - run: npx supabase db start
      # pgTAP tests in supabase/tests/database (RLS, triggers).
      - run: npx supabase test db
